# Publie deux versions sur GitHub Pages :
#   branche main -> https://vincentm498.github.io/MathCraft/      (prod)
#   branche dev  -> https://vincentm498.github.io/MathCraft/dev/  (test)
name: Déploiement Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - uses: actions/checkout@v4
        with: { ref: dev, path: dev }
        continue-on-error: true   # tant que la branche dev n'existe pas, seule la prod est publiée
      - name: Assembler le site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'worker' --exclude 'package.json' --exclude 'package-lock.json' --exclude 'node_modules' --exclude 'dev' main/ _site/
          if [ -d dev ]; then mkdir _site/dev && rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'worker' --exclude 'package.json' --exclude 'package-lock.json' --exclude 'node_modules' dev/ _site/dev/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
